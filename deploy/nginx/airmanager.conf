# /etc/nginx/sites-available/airmanager.conf
# Nginx Reverse Proxy for AirManager on Ubuntu 22.04 / 24.04 LTS

upstream airmanager_api {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream airmanager_web {
    server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 80;
    server_name *.ahmedadil.me _;

    # In production with TLS certificates provisioned under /etc/ssl/airmanager:
    # listen 443 ssl http2;
    # ssl_certificate /etc/ssl/airmanager/fullchain.pem;
    # ssl_certificate_key /etc/ssl/airmanager/privkey.pem;

    client_max_body_size 16M;

    # Server-Sent Events (SSE) live stream endpoint
    location /api/v1/events/stream {
        proxy_pass http://airmanager_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        read_timeout 3600s;
    }

    # FastAPI REST & Agent Protocol endpoints
    location /api/ {
        proxy_pass http://airmanager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Operator UI
    location / {
        proxy_pass http://airmanager_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
